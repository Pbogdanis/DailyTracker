<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Day Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; background: #121212; color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 1rem; }
    .day { aspect-ratio: 1; border: 1px solid #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
    .editor { margin-top: 1.5rem; background: #1e1e1e; padding: 1rem; border-radius: 8px; display: none; }
    input[type="color"] { border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
    textarea { width: 100%; height: 80px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 8px; margin-top: 8px; }
    button { background: #0070f3; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

  <h2>Daily Tracker</h2>
  <div id="auth-section">
    <button onclick="login()">Sign in with Google</button>
  </div>

  <div id="app" style="display:none;">
    <div class="grid" id="calendar"></div>

    <div class="editor" id="editor">
      <h3 id="selected-date">Selected Date</h3>
      <label>Pick Color: </label>
      <input type="color" id="color-picker" value="#3b82f6">
      <textarea id="note-input" placeholder="Type a short note for this day..."></textarea>
      <button onclick="saveEntry()">Save Entry</button>
    </div>
  </div>

  <script>
    // Replace with your Supabase details
    const SUPABASE_URL = 'https://nxuxqhktugktjufocawb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5EXbtN2AUOhPLzy96iQPtg_uUObUCOX';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedDate = null;

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (user) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        loadCalendar();
      }
    }

    async function login() {
      await supabase.auth.signInWithOAuth({ provider: 'google' });
    }

    async function loadCalendar() {
      // Fetch all entries for logged-in user
      const { data: entries } = await supabase.from('daily_entries').select('*');
      const entryMap = Object.fromEntries((entries || []).map(e => [e.date, e]));

      const cal = document.getElementById('calendar');
      cal.innerHTML = '';
      
      const now = new Date();
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEl = document.createElement('div');
        dayEl.className = 'day';
        dayEl.textContent = day;

        if (entryMap[dateStr]) {
          dayEl.style.backgroundColor = entryMap[dateStr].color;
        }

        dayEl.onclick = () => openEditor(dateStr, entryMap[dateStr]);
        cal.appendChild(dayEl);
      }
    }

    function openEditor(dateStr, entry) {
      selectedDate = dateStr;
      document.getElementById('selected-date').textContent = dateStr;
      document.getElementById('color-picker').value = entry?.color || '#3b82f6';
      document.getElementById('note-input').value = entry?.note || '';
      document.getElementById('editor').style.display = 'block';
    }

    async function saveEntry() {
      const color = document.getElementById('color-picker').value;
      const note = document.getElementById('note-input').value;

      await supabase.from('daily_entries').upsert({
        date: selectedDate,
        color: color,
        note: note
      });

      document.getElementById('editor').style.display = 'none';
      loadCalendar();
    }

    init();
  </script>
</body>
</html>
