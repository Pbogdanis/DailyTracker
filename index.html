<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tracker</title>
  <link rel="icon" href="data:,">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      max-width: 600px; 
      margin: 2rem auto; 
      padding: 0 1rem; 
      background: #121212; 
      color: #f3f4f6; 
    }
    h2 { font-weight: 600; margin-bottom: 1.5rem; }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(7, 1fr); 
      gap: 8px; 
      margin-top: 1rem; 
    }
    .day { 
      aspect-ratio: 1; 
      border: 1px solid #333; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      background-color: #1e1e1e;
      font-weight: 500;
      transition: transform 0.1s ease;
    }
    .day:hover { transform: scale(1.05); }
    .editor { 
      margin-top: 1.5rem; 
      background: #1e1e1e; 
      padding: 1.25rem; 
      border-radius: 8px; 
      border: 1px solid #333;
      display: none; 
    }
    .color-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1rem 0;
    }
    input[type="color"] { 
      border: none; 
      width: 40px; 
      height: 40px; 
      border-radius: 50%; 
      cursor: pointer; 
      background: none;
    }
    textarea { 
      width: 100%; 
      height: 80px; 
      background: #2a2a2a; 
      color: #fff; 
      border: 1px solid #444; 
      border-radius: 6px; 
      padding: 10px; 
      font-family: inherit;
      resize: vertical;
    }
    button { 
      background: #2563eb; 
      color: white; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 6px; 
      font-weight: 500;
      cursor: pointer; 
      margin-top: 10px; 
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <h2>Daily Tracker</h2>

  <div id="auth-section">
    <button onclick="login()">Sign in with Google</button>
  </div>

  <div id="app" style="display:none;">
    <div class="grid" id="calendar"></div>

    <div class="editor" id="editor">
      <h3 id="selected-date" style="margin-top:0;">Selected Date</h3>
      <div class="color-row">
        <label for="color-picker">Select Color:</label>
        <input type="color" id="color-picker" value="#3b82f6">
      </div>
      <textarea id="note-input" placeholder="Type a short note for this day..."></textarea>
      <br>
      <button onclick="saveEntry()">Save Entry</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nxuxqhktugktjufocawb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5EXbtN2AUOhPLzy96iQPtg_uUObUCOX';

    // Force explicit session detection from URL fragments (#access_token=)
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        detectSessionInUrl: true,
        autoRefreshToken: true,
        persistSession: true
      }
    });

    let selectedDate = null;

    function renderUI(session) {
      const authSection = document.getElementById('auth-section');
      const appSection = document.getElementById('app');

      if (session) {
        if (authSection) authSection.style.display = 'none';
        if (appSection) appSection.style.display = 'block';

        // Clean the hash string from browser history after reading session
        if (window.location.hash.includes('access_token')) {
          window.history.replaceState(null, null, window.location.pathname);
        }

        loadCalendar();
      } else {
        if (authSection) authSection.style.display = 'block';
        if (appSection) appSection.style.display = 'none';
      }
    }

    // Triggered automatically as soon as Supabase finishes parsing the URL hash
    supabaseClient.auth.onAuthStateChange((event, session) => {
      renderUI(session);
    });

    async function initAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      renderUI(session);
    }

    async function login() {
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin
        }
      });
    }

    async function loadCalendar() {
      const { data: entries, error } = await supabaseClient.from('daily_entries').select('*');
      if (error) {
        console.error('Database Error:', error.message);
        return;
      }

      const entryMap = Object.fromEntries((entries || []).map(e => [e.date, e]));
      const cal = document.getElementById('calendar');
      cal.innerHTML = '';

      const now = new Date();
      const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEl = document.createElement('div');
        dayEl.className = 'day';
        dayEl.textContent = day;

        if (entryMap[dateStr]) {
          dayEl.style.backgroundColor = entryMap[dateStr].color;
        }

        dayEl.onclick = () => openEditor(dateStr, entryMap[dateStr]);
        cal.appendChild(dayEl);
      }
    }

    function openEditor(dateStr, entry) {
      selectedDate = dateStr;
      document.getElementById('selected-date').textContent = dateStr;
      document.getElementById('color-picker').value = entry?.color || '#3b82f6';
      document.getElementById('note-input').value = entry?.note || '';
      document.getElementById('editor').style.display = 'block';
    }

    async function saveEntry() {
      const color = document.getElementById('color-picker').value;
      const note = document.getElementById('note-input').value;

      const { error } = await supabaseClient.from('daily_entries').upsert({
        date: selectedDate,
        color: color,
        note: note
      });

      if (error) {
        alert('Failed to save: ' + error.message);
        return;
      }

      document.getElementById('editor').style.display = 'none';
      loadCalendar();
    }

    initAuth();
  </script>
</body>
</html>
