<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- PWA manifest & theme -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">

<!-- iOS support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="apple-touch-icon" href="icon.svg">
  <title>Daily Tracker</title>
  <link rel="icon" href="data:,">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      max-width: 600px; 
      margin: 2rem auto; 
      padding: 0 1rem; 
      background: #121212; 
      color: #f3f4f6; 
    }
    h2 { font-weight: 600; margin-bottom: 1.5rem; text-align: center; }
    
    /* Calendar Header */
    .calendar-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 1rem; 
    }
    .calendar-header button { 
      background: #333; 
      color: #f3f4f6; 
      border: 1px solid #444; 
      padding: 6px 14px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-weight: 500;
    }
    .calendar-header button:hover { background: #444; }
    .calendar-header h3 { margin: 0; font-size: 1.1rem; }

    /* Weekday Labels */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      text-align: center;
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 0.5rem;
    }

    /* Calendar Grid */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(7, 1fr); 
      gap: 8px; 
    }
    .day { 
      aspect-ratio: 1; 
      border: 1px solid #333; 
      border-radius: 8px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      background-color: #1e1e1e;
      font-weight: 500;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }
    .day:hover { transform: scale(1.05); border-color: #555; }
    .day.empty { visibility: hidden; pointer-events: none; }

    /* Editor */
    .editor { 
      margin-top: 1.5rem; 
      background: #1e1e1e; 
      padding: 1.25rem; 
      border-radius: 8px; 
      border: 1px solid #333;
      display: none; 
    }
    .color-options {
      display: flex;
      gap: 12px;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .color-swatch { 
      width: 36px; 
      height: 36px; 
      border-radius: 50%; 
      cursor: pointer; 
      border: 2px solid transparent;
      transition: transform 0.1s, border-color 0.1s;
    }
    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.active { 
      border-color: #fff; 
      box-shadow: 0 0 0 2px #2563eb; 
    }
    
    textarea { 
      width: 100%; 
      height: 80px; 
      background: #2a2a2a; 
      color: #fff; 
      border: 1px solid #444; 
      border-radius: 6px; 
      padding: 10px; 
      font-family: inherit;
      resize: vertical;
    }
    .btn-primary { 
      background: #2563eb; 
      color: white; 
      border: none; 
      padding: 10px 18px; 
      border-radius: 6px; 
      font-weight: 500;
      cursor: pointer; 
      margin-top: 10px; 
      width: 100%;
    }
    .btn-primary:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <h2>Daily Tracker</h2>

  <div id="auth-section" style="text-align: center;">
    <button class="btn-primary" style="max-width: 250px;" onclick="login()">Sign in with Google</button>
  </div>

  <div id="app" style="display:none;">
    <div class="calendar-header">
      <button onclick="changeMonth(-1)">&#8592; Prev</button>
      <h3 id="current-month-year">Month Year</h3>
      <button onclick="changeMonth(1)">Next &#8594;</button>
    </div>

    <div class="weekdays">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="grid" id="calendar"></div>

    <div class="editor" id="editor">
      <h3 id="selected-date" style="margin-top:0;">Selected Date</h3>
      <label>Select Color:</label>
      <div class="color-options" id="color-options"></div>
      <textarea id="note-input" placeholder="Type a short note for this day..."></textarea>
      <br>
      <button class="btn-primary" onclick="saveEntry()">Save Entry</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://nxuxqhktugktjufocawb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5EXbtN2AUOhPLzy96iQPtg_uUObUCOX';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        detectSessionInUrl: true,
        autoRefreshToken: true,
        persistSession: true
      }
    });

    let viewDate = new Date(); // Tracks the currently viewed month
    let selectedDate = null;
    let selectedColor = '#3b82f6';

    const predefinedColors = [
      '#3b82f6', // Blue
      '#ef4444', // Red
      '#22c55e', // Green
      '#eab308', // Yellow
      '#a855f7', // Purple
      '#ec4899', // Pink
      '#f97316', // Orange
      '#6b7280'  // Gray
    ];

    function renderColorOptions() {
      const container = document.getElementById('color-options');
      container.innerHTML = '';
      predefinedColors.forEach(color => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.backgroundColor = color;
        if (color === selectedColor) swatch.classList.add('active');
        
        swatch.onclick = () => {
          selectedColor = color;
          document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
          swatch.classList.add('active');
        };
        container.appendChild(swatch);
      });
    }

    function renderUI(session) {
      const authSection = document.getElementById('auth-section');
      const appSection = document.getElementById('app');

      if (session) {
        if (authSection) authSection.style.display = 'none';
        if (appSection) appSection.style.display = 'block';

        if (window.location.hash.includes('access_token')) {
          window.history.replaceState(null, null, window.location.pathname);
        }

        loadCalendar();
      } else {
        if (authSection) authSection.style.display = 'block';
        if (appSection) appSection.style.display = 'none';
      }
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      renderUI(session);
    });

    async function initAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      renderUI(session);
    }

    async function login() {
      const redirectUrl = window.location.origin + window.location.pathname;
      await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: redirectUrl
        }
      });
    }

    function changeMonth(offset) {
      viewDate.setDate(1); // Prevents month-skipping bugs on the 31st
      viewDate.setMonth(viewDate.getMonth() + offset);
      loadCalendar();
    }

    function updateMonthHeader() {
      const options = { month: 'long', year: 'numeric' };
      document.getElementById('current-month-year').textContent = viewDate.toLocaleDateString('en-US', options);
    }

    async function loadCalendar() {
      updateMonthHeader();
      
      // Fetch all entries (for a personal app, this is fast and simple)
      const { data: entries, error } = await supabaseClient.from('daily_entries').select('*');
      if (error) {
        console.error('Database Error:', error.message);
        return;
      }

      const entryMap = Object.fromEntries((entries || []).map(e => [e.date, e]));
      const cal = document.getElementById('calendar');
      cal.innerHTML = '';

      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayOfWeek = new Date(year, month, 1).getDay(); // 0 = Sunday

      // Add empty slots for alignment
      for (let i = 0; i < firstDayOfWeek; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.className = 'day empty';
        cal.appendChild(emptyDay);
      }

      // Add actual days
      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEl = document.createElement('div');
        dayEl.className = 'day';
        dayEl.textContent = day;

        if (entryMap[dateStr]) {
          dayEl.style.backgroundColor = entryMap[dateStr].color;
          dayEl.style.color = '#fff'; // Ensure text is readable on colored backgrounds
          dayEl.style.textShadow = '0 1px 2px rgba(0,0,0,0.5)';
        }

        dayEl.onclick = () => openEditor(dateStr, entryMap[dateStr]);
        cal.appendChild(dayEl);
      }
    }

    function openEditor(dateStr, entry) {
      selectedDate = dateStr;
      document.getElementById('selected-date').textContent = dateStr;
      
      // Set selected color and re-render swatches to show active state
      selectedColor = entry?.color || '#3b82f6';
      renderColorOptions();
      
      document.getElementById('note-input').value = entry?.note || '';
      document.getElementById('editor').style.display = 'block';
      
      // Scroll to editor on mobile
      document.getElementById('editor').scrollIntoView({ behavior: 'smooth' });
    }

    async function saveEntry() {
      const note = document.getElementById('note-input').value;

      const { error } = await supabaseClient.from('daily_entries').upsert({
        date: selectedDate,
        color: selectedColor,
        note: note
      });

      if (error) {
        alert('Failed to save: ' + error.message);
        return;
      }

      document.getElementById('editor').style.display = 'none';
      loadCalendar();
    }

    // Initialize
    renderColorOptions();
    // Register the service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/DailyTracker/sw.js')
    .then((reg) => console.log('SW registered:', reg.scope))
    .catch((err) => console.error('SW failed:', err));
}
    initAuth();
  </script>
</body>
</html>
